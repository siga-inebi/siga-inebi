services:
  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    env_file:
      - backend/.env.example
      - .env
    command: ["/app/docker-entrypoint.sh"]
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      CSRF_TRUSTED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      TIME_ZONE: America/Guatemala
      SEED_DEMO_DATA_ON_START: "true"

  frontend:
    env_file:
      - frontend/.env.example
      - .env
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: /api/v1
      VITE_BACKEND_PROXY_TARGET: http://backend:8000

volumes:
  frontend_node_modules:
