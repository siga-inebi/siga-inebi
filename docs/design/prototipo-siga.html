<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SIGA-INEBI · Prototipo navegable</title>
<style>
  :root{
    --navy:#0b2234;
    --navy-2:#123852;
    --ink:#102438;
    --muted:#5c7183;
    --line:#d8e0e8;
    --line-soft:#e8eef4;
    --paper:#ffffff;
    --bg:#eef2f6;
    --gold:#d4a149;
    --blue:#1e598a;
    --ok:#1f7a4d;
    --warn:#a8710d;
    --bad:#a32b2b;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:var(--bg);
    line-height:1.5;
    font-size:14px;
  }
  button,input,select{font:inherit;color:inherit}
  a{color:var(--blue)}

  /* ---------- Barra de estado del prototipo ---------- */
  .protobar{
    background:#1c1c1c;color:#f2f2f2;padding:.45rem 1rem;
    display:flex;gap:1rem;align-items:center;flex-wrap:wrap;font-size:.78rem;
  }
  .protobar strong{color:var(--gold);letter-spacing:.06em}
  .protobar .spacer{flex:1}
  .protobar select{
    background:#2c2c2c;color:#fff;border:1px solid #444;border-radius:6px;padding:.25rem .5rem;font-size:.78rem;
  }
  .protobar button{
    background:transparent;color:#f2f2f2;border:1px solid #555;border-radius:6px;
    padding:.25rem .6rem;font-size:.78rem;cursor:pointer;
  }
  .protobar button:hover{border-color:var(--gold);color:var(--gold)}

  /* ---------- Marco de la aplicacion ---------- */
  .shell{display:flex;flex-direction:column;min-height:calc(100vh - 32px)}
  .topbar{
    background:var(--navy);color:#f6fafd;display:flex;align-items:center;gap:1rem;
    padding:.7rem 1.1rem;
  }
  .brand{display:flex;align-items:center;gap:.7rem}
  .brand .mark{
    width:38px;height:38px;border-radius:10px;background:var(--gold);color:var(--navy);
    display:grid;place-items:center;font-weight:700;font-size:.8rem;letter-spacing:.04em;
  }
  .brand b{display:block;font-size:.95rem;letter-spacing:.08em}
  .brand span{display:block;font-size:.72rem;color:rgba(246,250,253,.7)}
  .topsearch{
    flex:1;max-width:340px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
    border-radius:8px;padding:.35rem .7rem;color:#eaf2f8;
  }
  .topsearch::placeholder{color:rgba(234,242,248,.55)}
  .cyclechip{
    background:rgba(212,161,73,.18);border:1px solid rgba(212,161,73,.45);color:#f2d9a8;
    border-radius:999px;padding:.2rem .7rem;font-size:.75rem;white-space:nowrap;
  }
  .userchip{display:flex;align-items:center;gap:.5rem;font-size:.8rem;margin-left:auto}
  .userchip .avatar{
    width:30px;height:30px;border-radius:50%;background:var(--navy-2);
    border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:.7rem;
  }

  .body{display:flex;flex:1;min-height:0}
  .sidebar{
    width:214px;flex-shrink:0;background:#f7f9fb;border-right:1px solid var(--line);
    padding:.9rem .7rem;display:flex;flex-direction:column;gap:.15rem;
  }
  .sidebar .cap{
    font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    padding:.3rem .6rem .5rem;
  }
  .navitem{
    display:flex;align-items:center;gap:.55rem;padding:.5rem .6rem;border-radius:8px;
    cursor:pointer;color:var(--ink);text-decoration:none;font-size:.86rem;border:1px solid transparent;
  }
  .navitem:hover{background:#e9eff5}
  .navitem.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .navitem .ic{width:18px;text-align:center;opacity:.85}
  .sidefoot{margin-top:auto;padding:.6rem;border-top:1px solid var(--line);font-size:.75rem;color:var(--muted)}
  .sidefoot b{display:block;color:var(--ink);font-size:.8rem}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .crumbs{
    padding:.55rem 1.3rem;border-bottom:1px solid var(--line);background:#fff;
    font-size:.78rem;color:var(--muted);
  }
  .crumbs a{color:var(--muted);text-decoration:none}
  .crumbs a:hover{color:var(--blue);text-decoration:underline}
  .content{padding:1.3rem;flex:1;overflow:auto}
  .footbar{
    border-top:1px solid var(--line);background:#fff;padding:.45rem 1.3rem;
    font-size:.74rem;color:var(--muted);display:flex;gap:1.4rem;flex-wrap:wrap;
  }

  /* ---------- Piezas de contenido ---------- */
  h1{font-size:1.32rem;margin:0 0 .15rem}
  h2{font-size:1rem;margin:0 0 .6rem}
  h3{font-size:.82rem;margin:0 0 .5rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .pagehead{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
  .pagehead .sub{color:var(--muted);font-size:.86rem}
  .pagehead .acts{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;margin-bottom:1rem}
  .grid{display:grid;gap:.85rem}
  .g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
  .g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}

  .btn{
    background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:8px;
    padding:.42rem .85rem;cursor:pointer;font-size:.83rem;
  }
  .btn:hover{background:var(--navy-2)}
  .btn.sec{background:#fff;color:var(--navy);border-color:var(--line)}
  .btn.sec:hover{background:#eef3f8;border-color:var(--navy)}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#2a1d05}
  .btn.gold:hover{filter:brightness(1.06)}
  .btn.sm{padding:.24rem .6rem;font-size:.76rem}
  .btn.danger{background:#fff;color:var(--bad);border-color:#e3bcbc}

  .filters{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.85rem}
  .filters input[type=text]{border:1px solid var(--line);border-radius:8px;padding:.42rem .7rem;min-width:250px}
  .filters select{border:1px solid var(--line);border-radius:8px;padding:.42rem .55rem;background:#fff}
  .filters label{font-size:.78rem;color:var(--muted)}

  table{width:100%;border-collapse:collapse;font-size:.84rem}
  th{
    text-align:left;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);border-bottom:1px solid var(--line);padding:.5rem .55rem;font-weight:600;
  }
  td{padding:.55rem;border-bottom:1px solid var(--line-soft)}
  tbody tr:hover{background:#f6f9fc}
  tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:none;background:#f7f9fb}

  .tag{display:inline-block;padding:.1rem .5rem;border-radius:999px;font-size:.72rem;border:1px solid}
  .tag.ok{color:var(--ok);border-color:#bfe0cd;background:#eef7f2}
  .tag.warn{color:var(--warn);border-color:#ecd9ac;background:#fdf6e8}
  .tag.bad{color:var(--bad);border-color:#e6c2c2;background:#fbeeee}
  .tag.neutral{color:var(--muted);border-color:var(--line);background:#f4f7fa}

  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1rem}
  .kpi .lbl{font-size:.76rem;color:var(--muted)}
  .kpi .val{font-size:1.9rem;font-weight:600;line-height:1.1;margin:.15rem 0 .5rem}

  .quick{
    background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--gold);
    border-radius:var(--radius);padding:.85rem 1rem;cursor:pointer;
  }
  .quick:hover{border-color:var(--navy);border-left-color:var(--gold);background:#fbfcfe}
  .quick b{display:block;font-size:.92rem}
  .quick span{font-size:.78rem;color:var(--muted)}

  .tabs{display:flex;gap:.2rem;border-bottom:1px solid var(--line);margin-bottom:1rem;flex-wrap:wrap}
  .tab{
    padding:.5rem .85rem;cursor:pointer;font-size:.85rem;color:var(--muted);
    border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;
  }
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--navy);border-bottom-color:var(--gold);font-weight:600}

  .notice{
    border-radius:8px;padding:.6rem .8rem;font-size:.82rem;margin-bottom:.85rem;border:1px solid;
  }
  .notice.info{background:#eef4fa;border-color:#cfe0ee;color:#1c4b73}
  .notice.warn{background:#fdf6e8;border-color:#ecd9ac;color:#7a5208}
  .notice.bad{background:#fbeeee;border-color:#e6c2c2;color:#8a2626}

  .empty{text-align:center;padding:2.4rem 1rem;color:var(--muted)}
  .empty b{display:block;color:var(--ink);margin-bottom:.3rem;font-size:.95rem}

  dl.fields{display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;margin:0;font-size:.85rem}
  dl.fields dt{color:var(--muted)}
  dl.fields dd{margin:0}

  .steps{display:flex;gap:.4rem;margin-bottom:1.1rem;flex-wrap:wrap}
  .step{
    flex:1;min-width:130px;border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem;
    background:#fff;font-size:.78rem;color:var(--muted);
  }
  .step b{display:block;color:var(--ink);font-size:.84rem}
  .step.done{border-color:#bfe0cd;background:#f3faf6}
  .step.now{border-color:var(--navy);background:var(--navy);color:rgba(255,255,255,.75)}
  .step.now b{color:#fff}

  .wizardnav{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}
  .radio{display:flex;gap:.5rem;align-items:flex-start;padding:.6rem;border:1px solid var(--line);border-radius:8px;margin-bottom:.5rem;cursor:pointer}
  .radio:hover{background:#f6f9fc}
  .radio.on{border-color:var(--navy);background:#f2f7fb}
  .field{margin-bottom:.7rem}
  .field label{display:block;font-size:.76rem;color:var(--muted);margin-bottom:.2rem}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;background:#fff}

  .matrix td:first-child{font-weight:600}
  .legend{font-size:.78rem;color:var(--muted);margin-top:.7rem}
  .legend b{color:var(--ink)}

  .mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.7rem}
  .mapnode{border:1px solid var(--line);border-radius:8px;padding:.7rem .8rem;background:#fff;cursor:pointer}
  .mapnode:hover{border-color:var(--navy);background:#f7fafd}
  .mapnode b{display:block;font-size:.86rem}
  .mapnode code{font-size:.72rem;color:var(--muted);background:#f2f5f8;padding:.05rem .3rem;border-radius:4px}
  .maplevel{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:.9rem 0 .4rem}

  /* ---------- Login ---------- */
  .loginwrap{
    min-height:calc(100vh - 32px);display:grid;place-items:center;padding:2rem 1rem;
    background:
      radial-gradient(circle at top,rgba(212,161,73,.18),transparent 45%),
      radial-gradient(circle at right,rgba(30,89,138,.16),transparent 35%),
      linear-gradient(180deg,#f7f1e5 0%,#edf2f7 100%);
  }
  .loginbox{width:100%;max-width:390px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.8rem;box-shadow:0 18px 40px rgba(16,36,56,.09)}
  .loginbox .mark{width:56px;height:56px;border-radius:14px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;margin:0 auto .8rem}
  .loginbox h1{text-align:center;font-size:1.1rem;margin-bottom:.1rem}
  .loginbox .inst{text-align:center;color:var(--muted);font-size:.78rem;margin-bottom:1.3rem}
  .loginfoot{text-align:center;font-size:.74rem;color:var(--muted);margin-top:1rem}
  .rolepick{border-top:1px dashed var(--line);margin-top:1.1rem;padding-top:.9rem}
  .rolepick .hint{font-size:.72rem;color:var(--muted);margin-bottom:.4rem}

  .modal-back{position:fixed;inset:0;background:rgba(11,34,52,.45);display:grid;place-items:center;padding:1rem;z-index:50}
  .modal{background:#fff;border-radius:12px;max-width:430px;width:100%;padding:1.2rem 1.3rem;border:1px solid var(--line)}
  .modal h2{margin-bottom:.5rem}
  .modal p{font-size:.85rem;color:var(--muted);margin:0 0 1rem}
  .modal .acts{display:flex;gap:.5rem;justify-content:flex-end}

  @media (max-width:860px){
    .sidebar{display:none}
    .content{padding:1rem}
  }
</style>
</head>

<div id="root"></div>
<div id="modal-root"></div>

<script>

/* --------------------------------- Estado -------------------------------- */
const state = {
  role: "administrativo",

/* --------------------------- Datos de demostración ------------------------ */

const MATRÍCULAS = [

/* -------------------------------- Utilidades ------------------------------ */
const h = (html) => html;
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const role = () => ROLES[state.role];
const puede = (cap) => !!role().can[cap];

function moduloDe(hash){
  if(hash.startsWith("#/estudiantes")) return "estudiantes";
  if(hash.startsWith("#/personas"))    return "personas";
  if(hash.startsWith("#/academico"))   return "academico";
  if(hash.startsWith("#/matriculas"))  return "matriculas";
  if(hash.startsWith("#/reportes"))    return "reportes";
  if(hash.startsWith("#/usuarios") || hash.startsWith("#/permisos")) return "usuarios";
  if(hash.startsWith("#/app"))         return "app";
  return null;
}

function etiquetaModulo(m){

  opts = opts || {};
  return `<table>
    <thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
    <tbody>${filas.map(f=>`<tr>${f.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>

}

    ok: "Ver matrícula", action: () => { state.wizardStep = 1; go("#/matriculas"); }
  },
  "desactivar": {

    p: "La cuenta no podrá iniciar sesión. No se elimina y su historial se conserva. La acción queda auditada.",
    ok: "Desactivar cuenta", danger: true
  },

    ok: "Cerrar"
  },

    ok: "Cerrar"

    ok: "Cerrar"

};

function pintarModal(){
  const cont = document.getElementById("modal-root");
  if(!state.modal){ cont.innerHTML = ""; return; }
  const m = MODALES[state.modal];
  if(!m){ cont.innerHTML = ""; return; }
  cont.innerHTML = `<div class="modal-back" id="mback">
    <div class="modal">
      <h2>${esc(m.t)}</h2>
      <p>${esc(m.p)}</p>
      ${m.extra || ""}
      <div class="acts">
        <button class="btn sec" id="mcancel" type="button">Cancelar</button>
        <button class="btn ${m.danger ? "danger" : ""}" id="mok" type="button">${esc(m.ok)}</button>
      </div>
    </div>
  </div>`;
  document.getElementById("mcancel").onclick = () => { state.modal = null; pintarModal(); };
  document.getElementById("mok").onclick = () => {
    const act = m.action; state.modal = null; pintarModal();
    if(act) act(); else render();
  };
  document.getElementById("mback").onclick = (e) => {
    if(e.target.id === "mback"){ state.modal = null; pintarModal(); }
  };
}

/* --------------------------------- Router --------------------------------- */
function render(){
  const root = document.getElementById("root");
  let hash = location.hash || "#/login";
  const r = role();

  if(hash === "#/login" || !state.authenticated){
    if(hash !== "#/login"){ state.intended = hash; }
    root.innerHTML = vistaLogin();
    const sel = document.getElementById("loginrole");
    sel.onchange = () => { state.role = sel.value; sincronizarSelector(); render(); };
    document.getElementById("btning").onclick = () => {
      state.authenticated = true;
      const destino = state.intended || "#/app";
      state.intended = null;
      if(location.hash === destino) render(); else go(destino);
    };
    return;
  }

  const mod = moduloDe(hash);
  const rutasConocidas = PANTALLAS.map(p=>p.ruta).concat(["#/mapa"]);

  let crumbs = `<a href="#/app">Inicio</a>`;
  let contenido;

  if(hash === "#/mapa"){
    crumbs = `<a href="#/app">Inicio</a> &rsaquo; <span>Mapa de navegación</span>`;
    contenido = vistaMapa();
  } else if(!rutasConocidas.includes(hash)){
    crumbs = `<a href="#/app">Inicio</a> &rsaquo; <span>No encontrada</span>`;
    contenido = vista404();
  } else if(mod && !r.modules.includes(mod)){
    crumbs = `<a href="#/app">Inicio</a> &rsaquo; <span>Acceso denegado</span>`;
    contenido = vistaDenegado(mod);
  } else {
    switch(hash){
      case "#/app":
        crumbs = `<span>Panel</span>`;
        contenido = vistaPanel(); break;
      case "#/estudiantes":
        crumbs = `<a href="#/app">Inicio</a> &rsaquo; <span>${state.role==="encargado"?"Mis estudiantes":"Estudiantes"}</span>`;
        contenido = vistaEstudiantes(); break;
      case "#/estudiantes/expediente":
        crumbs = `<a href="#/app">Inicio</a> &rsaquo; <a href="#/estudiantes">Estudiantes</a> &rsaquo; <span>López García, María José</span>`;
        contenido = vistaExpediente(); break;
      case "#/personas":
        crumbs = `<a href="#/app">Inicio</a> &rsaquo; <span>Personas</span>`;
        contenido = vistaPersonas(); break;
      case "#/academico":
        crumbs = `<a href="#/app">Inicio</a> &rsaquo; <span>Estructura académica</span>`;
        contenido = vistaAcademico(); break;
      case "#/academico/oferta":
        crumbs = `<a href="#/app">Inicio</a> &rsaquo; <a href="#/academico">Estructura académica</a> &rsaquo; <span>Primero Básico · Matutina</span>`;
        contenido = vistaOferta(); break;
      case "#/matriculas":
        crumbs = `<a href="#/app">Inicio</a> &rsaquo; <span>Matrículas</span>`;
        contenido = vistaMatriculas(); break;
      case "#/matriculas/nueva":
        crumbs = `<a href="#/app">Inicio</a> &rsaquo; <a href="#/matriculas">Matrículas</a> &rsaquo; <span>Nueva matrícula</span>`;
        contenido = puede("operarMatricula") ? vistaWizard() : vistaDenegado("matriculas"); break;
      case "#/reportes":
        crumbs = `<a href="#/app">Inicio</a> &rsaquo; <span>Reportes</span>`;
        contenido = vistaReportes(); break;
      case "#/usuarios":
        crumbs = `<a href="#/app">Inicio</a> &rsaquo; <span>Usuarios y permisos</span>`;
        contenido = vistaUsuarios(); break;
      case "#/permisos":
        crumbs = `<a href="#/app">Inicio</a> &rsaquo; <a href="#/usuarios">Usuarios y permisos</a> &rsaquo; <span>Matriz de accesos</span>`;
        contenido = vistaPermisos(); break;
      case "#/login":
        contenido = ""; break;
      default:
        contenido = vista404();
    }
  }

  root.innerHTML = marco(hash, crumbs, contenido);

  const salir = document.getElementById("btnsalir");
  if(salir) salir.onclick = () => { state.authenticated = false; state.intended = null; go("#/login"); render(); };
}

/* ------------------------------- Interaccion ------------------------------ */
document.addEventListener("click", (e) => {
  const ir = e.target.closest("[data-go]");
  if(ir){ go(ir.getAttribute("data-go")); return; }

  const tabE = e.target.closest("[data-tab-exp]");
  if(tabE){ state.tabExpediente = tabE.getAttribute("data-tab-exp"); render(); return; }

  const tabA = e.target.closest("[data-tab-aca]");
  if(tabA){ state.tabAcademico = tabA.getAttribute("data-tab-aca"); render(); return; }

  const wz = e.target.closest("[data-wiz]");
  if(wz){ state.wizardStep = Number(wz.getAttribute("data-wiz")); render(); return; }

  const wst = e.target.closest("[data-wiz-st]");
  if(wst){ state.wizardStudent = wst.getAttribute("data-wiz-st"); render(); return; }

  const md = e.target.closest("[data-modal]");
  if(md){ state.modal = md.getAttribute("data-modal"); pintarModal(); return; }
});

function sincronizarSelector(){
  const sel = document.getElementById("rolesel");
  sel.value = state.role;
}

function iniciarSelector(){
  const sel = document.getElementById("rolesel");
  sel.innerHTML = Object.entries(ROLES).map(([k,r]) => `<option value="${k}">${esc(r.short)}</option>`).join("");
  sel.value = state.role;
  sel.onchange = () => {
    state.role = sel.value;
    state.tabExpediente = "general";
    render();
  };
  document.getElementById("btnmapa").onclick = () => {
    if(!state.authenticated){ state.authenticated = true; }
    go("#/mapa");
    render();
  };
  document.getElementById("btnreset").onclick = () => {
    state.authenticated = false; state.intended = null; state.wizardStep = 1;
    state.tabExpediente = "general"; state.tabAcademico = "sedes"; state.modal = null;
    pintarModal();
    if(location.hash === "#/login") render(); else go("#/login");
  };
}

window.addEventListener("hashchange", render);
iniciarSelector();
render();
</script>
