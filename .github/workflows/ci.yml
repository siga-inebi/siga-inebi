name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  # Pushes to develop do not trigger this file: deploy-qa.yml checks this
  # workflow's PR run (gate job) and only reruns it in full as a fallback.
  push:
    branches:
      - main
  workflow_call:
    inputs:
      full_run:
        description: "Corre todos los jobs sin mirar el diff (deploy-qa.yml lo usa como respaldo)."
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      diff_base:
        description: "Opcional: commit o rama contra la que calcular el diff. Vacío = suite completa."
        type: string
        default: ""

permissions:
  contents: read

# A new push to a PR cancels its previous run; other events never cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  POSTGRES_DB: siga_inebi_ci
  POSTGRES_USER: siga_inebi_ci
  POSTGRES_PASSWORD: siga_inebi_ci_password
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"

jobs:
  # Decides which areas changed (scripts/ci/detect-changes.mjs). Heavy jobs
  # keep their names and are skipped by `if:`, which a required check accepts.
  # Path filters at workflow level are not used: they would leave a required
  # check pending forever. If this job fails, every job runs (fail safe).
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      docker: ${{ steps.detect.outputs.docker }}
      workflows: ${{ steps.detect.outputs.workflows }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test change detection
        run: node --test scripts/ci/detect-changes.test.mjs scripts/ci/ci-gate.test.mjs

      - name: Detect changed areas
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          FULL_RUN: ${{ inputs.full_run }}
          DIFF_BASE: ${{ inputs.diff_base }}
        run: node scripts/ci/detect-changes.mjs ci

  backend-lint:
    name: backend-lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: siga_inebi_ci
          POSTGRES_USER: siga_inebi_ci
          POSTGRES_PASSWORD: siga_inebi_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siga_inebi_ci -d siga_inebi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements/dev.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Django system check
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_ENGINE: postgresql
          DATABASE_NAME: ${{ env.POSTGRES_DB }}
          DATABASE_USER: ${{ env.POSTGRES_USER }}
          DATABASE_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          DATABASE_HOST: ${{ env.POSTGRES_HOST }}
          DATABASE_PORT: ${{ env.POSTGRES_PORT }}
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          TIME_ZONE: America/Guatemala
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

  backend-tests:
    name: backend-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: siga_inebi_ci
          POSTGRES_USER: siga_inebi_ci
          POSTGRES_PASSWORD: siga_inebi_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siga_inebi_ci -d siga_inebi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements/dev.txt

      - name: Pytest with coverage
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_ENGINE: postgresql
          DATABASE_NAME: ${{ env.POSTGRES_DB }}
          DATABASE_USER: ${{ env.POSTGRES_USER }}
          DATABASE_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          DATABASE_HOST: ${{ env.POSTGRES_HOST }}
          DATABASE_PORT: ${{ env.POSTGRES_PORT }}
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          TIME_ZONE: America/Guatemala
          # Python 3.12 sys.monitoring tracer: same line coverage, less overhead.
          COVERAGE_CORE: sysmon
        # pytest-django creates one database per xdist worker (test_<db>_gwN)
        # and runs every migration there, so a separate `migrate` step is not
        # needed. pytest-cov merges the workers' coverage before --cov-fail-under.
        # worksteal rebalances the slow tests collected last (migrations,
        # backup drills) instead of queueing them behind one worker.
        run: |
          pytest -n auto --dist worksteal --durations=15

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  backend-security:
    name: backend-security
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements/dev.txt

      - name: Bandit
        working-directory: backend
        run: bandit -q -r apps config

      - name: pip-audit
        working-directory: backend
        run: pip-audit -r requirements/dev.txt

  frontend-lint:
    name: frontend-lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier check
        working-directory: frontend
        run: npm run format:check

  frontend-tests:
    name: frontend-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Vitest coverage
        working-directory: frontend
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error

  frontend-build:
    name: frontend-build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        run: npm run build

  docker-integration:
    name: docker-integration
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env file
        run: cp .env.example .env

      - name: Docker Compose config
        run: docker compose config

      - name: Build and start stack
        env:
          COMPOSE_PROJECT_NAME: siga_inebi_ci
        run: |
          docker compose up --build -d

      - name: Wait for services
        env:
          COMPOSE_PROJECT_NAME: siga_inebi_ci
        run: |
          for service in db backend; do
            timeout 120 sh -c "until [ \"$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' siga_inebi_ci-${service}-1)\" = healthy ]; do sleep 3; done"
          done
          timeout 180 sh -c "until curl -fsS http://127.0.0.1:5173/ >/dev/null; do sleep 3; done"
          timeout 180 sh -c "until curl -fsS http://127.0.0.1:8000/api/v1/health/ >/dev/null; do sleep 3; done"

      - name: Verify backend and frontend
        run: |
          curl -fsS http://127.0.0.1:8000/api/v1/health/
          curl -fsS http://127.0.0.1:8000/api/v1/health/database/
          curl -fsS http://127.0.0.1:5173/

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup
        if: always()
        env:
          COMPOSE_PROJECT_NAME: siga_inebi_ci
        run: docker compose down -v --remove-orphans
