name: Dependency Review

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Skip on private repos without guaranteed plan support
        if: ${{ github.event.repository.private }}
        run: echo "Dependency Review left as informational on private repositories. See security workflow and pip-audit for enforced dependency checks."

      - name: Dependency review
        if: ${{ !github.event.repository.private }}
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
